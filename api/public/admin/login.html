<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in – The Fatty</title>
<meta name="theme-color" content="#0b0707">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0707'/%3E%3Crect x='3' y='12' width='26' height='8' fill='%23c0392b'/%3E%3Crect x='13' y='10' width='6' height='12' fill='%23f2b134'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/shared/app.css">
</head>
<body>

<header class="nav">
  <a class="brand" href="https://orlinstefanov.github.io/TheFattyWebsite/">THE FATTY</a>
  <nav><a href="https://orlinstefanov.github.io/TheFattyWebsite/">Back to site</a></nav>
</header>

<main class="auth">
  <h1>Sign in</h1>
  <form id="login-form" class="form" novalidate>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p id="login-error" class="form-error" role="alert" hidden></p>
    <button id="login-submit" class="btn-solid" type="submit">Sign in</button>
  </form>
</main>

<script src="/shared/api.js"></script>
<script src="/admin/js/login.js"></script>
</body>
</html>
