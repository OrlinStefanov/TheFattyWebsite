# Render Blueprint: New -> Blueprint -> pick this repo.
services:
  - type: web
    name: thefatty-api
    runtime: node
    plan: free
    rootDir: api
    # --include=dev: NODE_ENV=production would otherwise skip TypeScript, which the build needs.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: https://orlinstefanov.github.io
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: IP_HASH_SECRET
        generateValue: true
